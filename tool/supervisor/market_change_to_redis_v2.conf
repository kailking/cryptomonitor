[program:market_change_to_redis_v2]
; Upload source and build on the server first. Only Supervisor may start/stop this binary.
process_name=%(program_name)s_%(process_num)02d
directory=/www/wwwroot/go_project/exchange_hub
command=/www/wwwroot/go_project/exchange_hub/bin/market_change_to_redis_v2
environment=MARKET_CHANGE_ENV_FILE="/www/wwwroot/go_project/exchange_hub/.env"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/tool/storage/logs/supervisor/market_change_to_redis_v2.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=30
priority=965
